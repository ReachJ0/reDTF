version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: redtf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: DTF_systema
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Ejecuta las migraciones automáticamente al iniciar por primera vez
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/001_normalizacion_auditoria_borrado_logico.sql:/docker-entrypoint-initdb.d/02-mig1.sql:ro
      - ./migrations/002_catalogo_roles_y_default_usuarios.sql:/docker-entrypoint-initdb.d/03-mig2.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DTF_systema"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: redtf-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/DTF_systema
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: